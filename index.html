          <a href="mailto:ni31071987@gmail.com" class="px-3 py-1.5 rounded-xl bg-white/15 border border-[#D4AF37]/40 font-bold">✉️ ni31071987@gmail.com</a>

  <script>
    let lang = 'ur', activeTopTool = null, currentModalId = 1, isAdminLoggedIn = false, secretTaps = 0, tapTimer = null;
    const tr = (ur, en) => lang === 'ur' ? ur : en;
    const fCls = () => lang === 'ur' ? 'urdu-font' : 'eng-font';

    const shareSvgIcon = `<svg class="w-3.5 h-3.5 inline-block fill-current" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`;

    // 15 Distinct Sets of 10 Non-Repeating, Actionable Poverty Alleviation & Asset Building Points
    const guidePointsData = {
      1: [ // Budgeting
        ['1. تنخواہ ملتے ہی سب سے پہلے خود کو ادائیگی (20% بچت)', 'Pay Yourself First (20% Savings)', '• اصول: تنخواہ یا مزدوری ملتے ہی خرچ سے پہلے 10% سے 20% رقم الگ رکھیں۔\n• عملی قدم: تنخواہ آتے ہی اتنی رقم سیونگ گلے یا الگ اکاؤنٹ میں ڈال دیں۔', '• Rule: Set aside 10% to 20% right at the start of the month before spending.'],
        ['2. ہول سیل مارکیٹ سے ماہانہ راشن کی بلک خریداری', 'Bulk Wholesale Grocery Shopping', '• اصول: پرچون مہنگی دکان کے بجائے ہول سیل منڈی سے ایک بار سودا لیں۔\n• عملی قدم: آٹا، گھی اور دالیں مہینے کی پہلی تاریخ کو اکٹھی خریدیں تاکہ 20% بچت ہو۔', '• Rule: Buy core staples in bulk from wholesale markets to save 15%–20%.'],
        ['3. یوٹیلیٹی بلوں میں سمارٹ کٹوتی (Peak Hours کا استعمال)', 'Smart Utility Bill Reduction', '• اصول: بجلی کے بلوں کو کم کرنے کے لیے اوقات کار کا خیال رکھیں۔\n• عملی قدم: شام 6 سے 10 بجے کے دوران بھاری آلات (استری، موٹر) چلانے سے گریز کریں۔', '• Rule: Avoid heavy appliances during peak hours (6 PM–10 PM) to slash electricity bills.'],
        ['4. غیر ضروری روزمرہ کے چھوٹے اخراجات (Micro-Leaks) کا خاتمہ', 'Eliminating Daily Micro-Leaks', '• اصول: چائے، باہر کے ناشتے اور سگریٹ جیسے روزانہ کے چھوٹے خرچے سالانہ بڑی رقم بناتے ہیں۔\n• عملی قدم: گھر سے پانی اور ناشتہ ساتھ لے جانے کی عادت ڈالیں۔', '• Rule: Cut casual daily spending like outside tea and snacks to save big annually.'],
        ['5. گھریلو بجٹ کے لیے 50/30/20 رول کا نفاذ', 'Implementing the 50/30/20 Rule', '• اصول: 50% ضروریات، 30% خواہشات اور 20% بچت پر ماہانہ بجٹ سیٹ کریں۔\n• عملی قدم: ہر ماہ کے شروع میں اپنے تمام اخراجات ان تین حصوں میں بانٹ دیں۔', '• Rule: Allocate 50% for needs, 30% for wants, and 20% strictly for savings.'],
        ['6. بچوں کے اسکول کے اخراجات کی پلاننگ', 'School Expense Planning', '• اصول: کتابیں اور یونیفارم سیکنڈ ہینڈ یا ہول سیل سے خریدیں۔\n• عملی قدم: سارا سال مہنگی فیسوں کے علاوہ اضافی کوچنگ کے بوجھ سے بچنے کے لیے خود گائیڈ کریں۔', '• Rule: Buy school supplies in bulk and guide children at home to save tuition costs.'],
        ['7. مہینے کے اختتام پر مالیاتی آڈٹ (Monthly Financial Review)', 'Monthly Financial Review', '• اصول: ہر ماہ کے آخر میں دیکھیں کہ پیسے کہاں زیادہ خرچ ہوئے۔\n• عملی قدم: ڈائری یا ایپ میں لکھے گئے تمام اخراجات کا موازنہ اپنی آمدنی سے کریں۔', '• Rule: Review all monthly expenditures on the last day to plug financial leaks.'],

      6: [ // Emergency Shield

        ['6. نئے قرض لینے پر تاحیات پابندی (Zero New Debt Rule)', 'The Zero New Debt Rule', '• اصول: آج کے بعد قسم اٹھائیں کہ کبھی سودی قرض نہیں لیں گے۔\n• عملی قدم: جتنی چادر ہو اتنے پاؤں پھیلائیں۔', '• Rule: Vow never to take on new interest-bearing debt for lifestyle inflation.'],

      12: [ // Vehicle Rules

    function calcZ(p) { let t = (+document.getElementById('zc-'+p).value||0)+(+document.getElementById('zg-'+p).value||0)+(+document.getElementById('zb-'+p).value||0); document.getElementById('zt-'+p).textContent = 'Rs. '+Math.round(t*0.025).toLocaleString(); }
    function calcG(p) { let d = +document.getElementById('gd-'+p).value||0, r = +document.getElementById('gr-'+p).value||1, yr = d*365; document.getElementById('gy-'+p).textContent = 'Rs. '+yr.toLocaleString(); document.getElementById('gg-'+p).textContent = (yr/r).toFixed(2)+' Grams'; }
    function calcD(p) { let e = +document.getElementById('em-'+p).value||0, dt = +document.getElementById('dt-'+p).value||0, dp = +document.getElementById('dp-'+p).value||1; document.getElementById('er-'+p).textContent = `Rs. ${(e*3/1000).toFixed(0)}k – ${(e*6/1000).toFixed(0)}k`; document.getElementById('dr-'+p).textContent = Math.ceil(dt/dp) + tr(' ماہ (Months)',' Months'); }
    function addBiz(cId, p) { let d = document.getElementById('bd-'+p).value.trim(), a = +document.getElementById('ba-'+p).value||0, t = document.getElementById('bt-'+p).value; if (!d || a<=0) return; bizData.unshift({desc:d, amt:a, type:t}); localStorage.setItem('flp_biz_pro', JSON.stringify(bizData)); renderToolHTML(cId, 'business', p); }

    function postChatMessage(e) {
      e.preventDefault(); let n = document.getElementById('chatName').value.trim(), t = document.getElementById('chatText').value.trim(); if (!n || !t) return;
      chatData.unshift({ name: n, text: t, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      localStorage.setItem('flp_chat_pro', JSON.stringify(chatData)); document.getElementById('chatText').value = ''; renderChat();
    }
    function renderChat() {
      const def = { name: tr('ندیم اقبال (ڈویلپر)','Nadeem Iqbal (Developer)'), text: tr('خوش آمدید! ایپ کو مزید بہتر بنانے کے لیے اپنی قیمتی تجاویز اور آراء یہاں ضرور شیئر کریں۔','Welcome! Please share your valuable suggestions and feedback here to improve this app.'), time: tr('لائیو','Live') };
      document.getElementById('chatMessagesList').innerHTML = [def, ...chatData].map(c => `<div class="p-3 bg-slate-50 border rounded-2xl"><div class="flex justify-between mb-1"><span class="font-extrabold text-[#064E3B] text-xs">${c.name}</span><span class="text-[10px] text-gray-400">${c.time}</span></div><p class="text-gray-800 ${fCls()} text-xs">${c.text}</p></div>`).join('');
    }

    function showToast(text, isUpload) {
      const toast = document.getElementById('progressToast');
      const arrow = document.getElementById('toastArrow');
      const msg = document.getElementById('toastText');
      arrow.textContent = isUpload ? '⬆️' : '⬇️';
      arrow.className = isUpload ? 'text-lg text-[#F3E5AB] arrow-up' : 'text-lg text-[#F3E5AB] arrow-down';
      msg.textContent = text;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3200);
    }

    function downloadPdfFile(pdfUrl, title) {
      showToast(tr(`📥 "${title}" ڈاؤن لوڈ ہو رہی ہے...`, `📥 Downloading "${title}"...`), false);
      setTimeout(() => {
        if (pdfUrl && (pdfUrl.startsWith('data:') || pdfUrl.startsWith('blob:'))) {
          const a = document.createElement('a');
          a.href = pdfUrl; a.download = title + '.pdf';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        } else {
          window.print();
        }
      }, 900);
    }

    function downloadCurrentPdf() {
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const g = allGuides.find(x => x[0] === currentModalId);
      if (g) downloadPdfFile(g[11] || '', tr(g[3], g[4]));
    }

    function handleDevUpload() {
      if (!isAdminLoggedIn) return;
      const titleInput = document.getElementById('devPdfTitle');
      const fileInput = document.getElementById('devPdfFile');
      const msg = document.getElementById('uploadMsg');
      const title = titleInput.value.trim();

      if (fileInput.files.length > 0 && title) {
        showToast(tr('⬆️ نئی پی ڈی ایف اپلوڈ ہو رہی ہے...', '⬆️ Uploading new PDF...'), true);
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const dataUrl = evt.target.result;
          const newId = Date.now();
          const newPdfItem = [
            newId, 'ڈویلپر پی ڈی ایف', 'Developer PDF', title, title,
            'ڈویلپر کی جانب سے اپلوڈ کردہ خصوصی پی ڈی ایف گائیڈ۔', 'Special PDF guide uploaded by the developer.',
            null, '', '',
            getTenPoints(1),
            dataUrl
          ];
          try {
            uploadedPdfs.push(newPdfItem);
            localStorage.setItem('flp_uploaded_pdfs_v3', JSON.stringify(uploadedPdfs));
          } catch(err) {
            newPdfItem[11] = URL.createObjectURL(file);
          }
          msg.textContent = tr('✅ پی ڈی ایف کامیابی سے اپلوڈ ہو گئی!', '✅ PDF uploaded successfully!');
          titleInput.value = ''; fileInput.value = '';
          renderGuides();
        };
        reader.readAsDataURL(file);
      } else {
        msg.textContent = tr('❌ براہ کرم گائیڈ کا نام اور پی ڈی ایف فائل دونوں منتخب کریں۔', '❌ Please enter a title and select a PDF file.');
      }
    }

    function editGuide(event, id) {
      event.stopPropagation();
      if (!isAdminLoggedIn) return;
      let allGuides = [...baseGuides, ...uploadedPdfs];
      const g = allGuides.find(x => x[0] === id); if (!g) return;
      const newTitle = prompt(tr('گائیڈ کا نیا نام درج کریں:', 'Enter new title for guide:'), tr(g[3], g[4]));
      if (newTitle && newTitle.trim()) {
        g[3] = newTitle.trim(); g[4] = newTitle.trim();
        localStorage.setItem('flp_uploaded_pdfs_v3', JSON.stringify(uploadedPdfs));
        renderGuides();
        showToast(tr('✏️ گائیڈ اپڈیٹ ہو گئی!', '✏️ Guide updated!'), true);
      }
    }

    function deleteGuide(event, id) {
      event.stopPropagation();
      if (!isAdminLoggedIn) return;
      if (confirm(tr('کیا آپ واقعی اس گائیڈ کو حذف کرنا چاہتے ہیں؟ باقی نمبرز خودکار اپڈیٹ ہو جائیں گے۔', 'Delete this guide? Remaining numbers will auto-update.'))) {
        const upIdx = uploadedPdfs.findIndex(x => x[0] === id);
        if (upIdx !== -1) {
          uploadedPdfs.splice(upIdx, 1);
          localStorage.setItem('flp_uploaded_pdfs_v3', JSON.stringify(uploadedPdfs));
        } else {
          baseGuides = baseGuides.filter(x => x[0] !== id);
          deletedBaseIds.push(id);
          localStorage.setItem('flp_deleted_base', JSON.stringify(deletedBaseIds));
        }
        renderGuides();
        showToast(tr('🗑️ گائیڈ حذف ہو گئی اور نمبرنگ اپڈیٹ ہو گئی!', '🗑️ Guide deleted & numbering auto-updated!'), false);
      }
    }

    function renderGuides() {
      const q = (document.getElementById('searchBox').value || '').toLowerCase();
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const totalCount = allGuides.length;

      document.getElementById('heroBadgeText').textContent = tr(
        `💎 ${totalCount} مکمل گائیڈز + 6 عملی ٹولز`,
        `💎 ${totalCount} Master Guides + 6 Live Tools`
      );
      document.getElementById('libraryHeading').textContent = tr(
        `📚 اثاثہ سازی، قانونی رہنمائی اور پی ڈی ایف لائبریری (${totalCount} مکمل کتابچے):`,
        `📚 Asset Building, Legal Guides & PDF Library (${totalCount} Master Guides):`
      );

      const list = allGuides.filter(g => (lang === 'ur' ? g[1]+g[3]+g[5] : g[2]+g[4]+g[6]).toLowerCase().includes(q));

      document.getElementById('guidesList').innerHTML = list.map((g, idx) => {
        const st = getStat(g[0]);
        const titleTxt = `${idx + 1}. ${tr(g[3], g[4])}`;
        return `
        <div onclick="openGuide(${g[0]}, ${idx + 1})" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-md hover:border-[#D4AF37] transition cursor-pointer">
          <div class="flex justify-between items-center mb-1.5">
            <span class="px-2.5 py-0.5 bg-emerald-900 text-emerald-100 text-[10px] font-bold rounded-full">${tr(g[1], g[2])}</span>
            <div class="flex items-center gap-1.5">
              <span class="text-[10px] bg-amber-100 text-amber-900 px-2 py-0.5 rounded font-bold">#${idx + 1}</span>
              <button onclick="event.stopPropagation(); downloadPdfFile('${g[11]||''}', '${tr(g[3],g[4])}')" class="text-[10px] bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded font-bold">📥 PDF</button>
              ${isAdminLoggedIn ? `
                <button onclick="editGuide(event, ${g[0]})" class="text-[10px] bg-blue-100 text-blue-900 px-2 py-0.5 rounded font-bold">✏️</button>
                <button onclick="deleteGuide(event, ${g[0]})" class="text-[10px] bg-red-100 text-red-900 px-2 py-0.5 rounded font-bold">🗑️</button>
              ` : ''}
            </div>
          </div>

          <h3 class="text-xs md:text-sm font-bold text-[#0A192F] ${fCls()} mb-1">${titleTxt}</h3>
          <p class="text-[11px] text-gray-600 ${fCls()} mb-3">${tr(g[5], g[6])}</p>

          <div class="flex flex-wrap justify-between items-center gap-2 pt-2.5 border-t text-xs">
            <span class="text-[#064E3B] font-extrabold">${tr('مکمل گائیڈ اور قانونی سٹیپس (10 عملی پوائنٹس) پڑھیں ←','Read Full 10-Step Guide →')}</span>
            ${g[7] ? `<button onclick="toggleCardTool(event, ${g[0]}, '${g[7]}')" class="px-3 py-1 gold-bg text-[#0A192F] font-extrabold text-[11px] rounded-xl shadow-sm">${tr(g[8], g[9])}</button>` : ''}
          </div>

          <!-- Social Engagement Bar with Authentic Social Share SVG Icon -->
          <div onclick="event.stopPropagation()" class="flex items-center justify-between gap-1 mt-3 pt-2.5 border-t border-dashed border-gray-200 text-[11px] text-gray-600 font-bold">
            <span class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-100">
              👁️ <span>${st.views}</span> <span class="hidden sm:inline">${tr('ویوز','Views')}</span>
            </span>
            <button onclick="toggleLike(event, ${g[0]})" class="flex items-center gap-1 px-2.5 py-1 rounded-lg ${st.liked ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-slate-100 hover:bg-red-50'} transition">
              ${st.liked ? '❤️' : '🤍'} <span>${st.likes}</span> <span>${tr('لائک','Like')}</span>
            </button>
            <button onclick="toggleCommentBox(event, ${g[0]})" class="flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-emerald-50 text-[#0A192F] transition">
              💬 <span>${st.comments.length}</span> <span>${tr('کمنٹ','Comment')}</span>
            </button>
            <button onclick="shareGuide(event, ${g[0]}, '${titleTxt}')" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-[#064E3B] border border-emerald-200 transition">
              ${shareSvgIcon} <span>${st.shares}</span> <span>${tr('شیئر','Share')}</span>
            </button>
          </div>

          <!-- Inline Comment Section -->
          <div id="commBox-${g[0]}" onclick="event.stopPropagation()" class="hidden mt-3 p-3 bg-slate-50 rounded-xl border border-gray-200 text-xs space-y-2">
            <form onsubmit="addGuideComment(event, ${g[0]})" class="flex flex-col sm:flex-row gap-1.5">
              <input type="text" id="cName-${g[0]}" required placeholder="${tr('آپ کا نام','Your Name')}" class="sm:w-1/3 p-1.5 border rounded-lg bg-white text-xs font-semibold" />
              <input type="text" id="cText-${g[0]}" required placeholder="${tr('اس کتابچے پر اپنا تبصرہ لکھیں...','Write a comment on this guide...')}" class="flex-1 p-1.5 border rounded-lg bg-white text-xs" />
              <button type="submit" class="px-3 py-1.5 hero-bg text-white font-bold rounded-lg text-xs shrink-0">${tr('ارسال','Post')}</button>
            </form>
            <div class="space-y-1.5 max-h-32 overflow-y-auto pt-1">
              ${st.comments.length === 0 ? `<p class="text-[10px] text-gray-400 text-center">${tr('ابھی تک کوئی تبصرہ نہیں۔ پہلا کمنٹ کریں!','No comments yet. Be the first!')}</p>` : st.comments.map(c => `<div class="p-2 bg-white border rounded-lg flex justify-between items-start gap-2"><div><b class="text-[#064E3B]">${c.name}:</b> <span class="${fCls()}">${c.text}</span></div><span class="text-[9px] text-gray-400 shrink-0">${c.time}</span></div>`).join('')}
            </div>
          </div>

          <div id="cardTool-${g[0]}" onclick="event.stopPropagation()" class="hidden mt-3"></div>
        </div>`;
      }).join('');
    }

    function toggleAcc(i) {
      const c = document.getElementById('acc-c-'+i), ic = document.getElementById('acc-i-'+i);
      const hide = !c.classList.contains('hidden'); c.classList.toggle('hidden', hide); ic.textContent = hide ? '▼' : '▲';
    }

    function openGuide(id, displayNum) {
      currentModalId = id;
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const g = allGuides.find(x => x[0] === id); if (!g) return;

      const st = getStat(id);
      st.views += 1;
      saveStats();
      renderGuides();

      const numPrefix = displayNum ? `${displayNum}. ` : '';
      document.getElementById('mTitle').textContent = numPrefix + tr(g[3], g[4]);
      
      let pdfPreview = g[11] ? `
        <div class="p-3 bg-emerald-950 text-white rounded-xl flex items-center justify-between">
          <span class="text-xs font-bold">📄 ${tr('اصل پی ڈی ایف فائل منسلک ہے','Original PDF File Attached')}</span>
          <a href="${g[11]}" target="_blank" class="px-3 py-1.5 rounded-lg gold-bg text-[#0A192F] font-extrabold text-xs">👁️ ${tr('پی ڈی ایف کھولیں','Open Full PDF')}</a>
        </div>` : '';

      document.getElementById('mBody').innerHTML = `
        <div class="bg-white p-4 rounded-2xl border-2 border-emerald-200 space-y-3">
          ${pdfPreview}
          <div class="border-b pb-2 flex justify-between items-center flex-wrap gap-2">
            <div>
              <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-900 text-white font-bold">${tr('پاکستانی قانونی و عملی گائیڈ (10 پوائنٹس)','Pakistani Legal & Practical Guide (10 Steps)')}</span>
              <p class="font-extrabold text-[#0A192F] text-xs md:text-sm ${fCls()} mt-2">${tr(g[5], g[6])}</p>
            </div>
            <span class="text-[11px] bg-slate-100 px-2.5 py-1 rounded-lg font-bold text-gray-700">👁️ ${st.views} ${tr('مرتبہ پڑھا گیا','Views')}</span>
          </div>
          <p class="text-[11px] text-emerald-900 font-bold bg-amber-50 p-2.5 rounded-xl border border-amber-200 ${fCls()}">${tr('💡 ہدایت: نیچے دیے گئے 10 میں سے کسی بھی عملی پوائنٹ پر کلک کریں تاکہ اس کی تفصیلی گائیڈ کھل جائے:','💡 Tip: Click any of the 10 actionable steps below to expand its detailed guidance:')}</p>
          <div class="space-y-2">
            ${g[10].map((pt, i) => `
              <div class="bg-emerald-50/70 rounded-2xl border border-emerald-200 overflow-hidden">
                <button onclick="toggleAcc(${i})" class="w-full p-3.5 ${lang==='ur'?'text-right':'text-left'} font-extrabold text-[#0A192F] text-xs md:text-sm flex justify-between items-center gap-2 bg-white">
                  <span class="${fCls()}">${tr(pt[0], pt[1])}</span>
                  <span id="acc-i-${i}" class="text-emerald-800 text-xs bg-emerald-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">${i===0?'▲':'▼'}</span>
                </button>
                <div id="acc-c-${i}" class="${i===0?'':'hidden'} p-3.5 bg-emerald-50/90 border-t border-emerald-200 text-gray-900 text-xs md:text-sm ${fCls()} whitespace-pre-line">${tr(pt[2], pt[3])}</div>
              </div>`).join('')}
          </div>
        </div>`;
      document.getElementById('guideModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('guideModal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

    window.onload = () => { switchLang('ur'); updateLiveClock(); };
  </script>
</body>
</html>
