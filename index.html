        box.innerHTML = `<div class="bg-white text-gray-900 rounded-2xl p-4 border-2 border-amber-500 shadow-lg text-xs">${header(tr('🥇 مائکرو گولڈ اور روزانہ بچت کیلکولیٹر','🥇 Micro-Gold & Daily Saving Calculator'))}<div class="grid grid-cols-2 gap-2 mb-3"><div><label class="block font-bold mb-1">${tr('روزانہ بچت (PKR):','Daily Saving (PKR):')}</label><input type="number" id="gd-${p}" value="200" oninput="calcG('${p}')" class="w-full p-2 border rounded-xl font-bold" /></div><div><label class="block font-bold mb-1">${tr('1 گرام سونے کا ریٹ:','24K Gold Rate/Gram:')}</label><input type="number" id="gr-${p}" value="24000" oninput="calcG('${p}')" class="w-full p-2 border rounded-xl font-bold" /></div></div><div class="grid grid-cols-2 gap-2 text-center"><div class="p-2 bg-amber-50 rounded-xl border border-amber-300"><b>${tr('سالانہ جمع شدہ رقم','1-Year Saved Cash')}</b><p id="gy-${p}" class="font-black text-amber-950 text-sm mt-1">Rs. 73,000</p></div><div class="p-2 bg-emerald-50 rounded-xl border border-emerald-300"><b>${tr('سالانہ خالص سونا (گرام)','Accumulated 24K Gold')}</b><p id="gg-${p}" class="font-black text-emerald-950 text-sm mt-1">3.04 Grams</p></div></div></div>`;
      } else if (type === 'goal') {
        box.innerHTML = `<div class="bg-white text-gray-900 rounded-2xl p-4 border-2 border-blue-500 shadow-lg text-xs">${header(tr('🎯 ایمرجنسی فنڈ اور قرض نجات پلانر','🎯 Emergency Fund & Debt Payoff Planner'))}<div class="grid grid-cols-3 gap-2 mb-3"><div><label class="block font-bold mb-1">${tr('ماہانہ گھر خرچ:','Monthly Expense:')}</label><input type="number" id="em-${p}" value="30000" oninput="calcD('${p}')" class="w-full p-2 border rounded-xl font-bold" /></div><div><label class="block font-bold mb-1">${tr('کل قرض یا ہدف:','Total Debt/Goal:')}</label><input type="number" id="dt-${p}" value="100000" oninput="calcD('${p}')" class="w-full p-2 border rounded-xl font-bold" /></div><div><label class="block font-bold mb-1">${tr('ماہانہ قسط ادائیگی:','Monthly Payoff:')}</label><input type="number" id="dp-${p}" value="10000" oninput="calcD('${p}')" class="w-full p-2 border rounded-xl font-bold" /></div></div><div class="grid grid-cols-2 gap-2 text-center"><div class="p-2 bg-blue-50 rounded-xl border border-blue-200"><b>${tr('محفوظ ایمرجنسی فنڈ (3 تا 6 ماہ)','3–6 Month Emergency Target')}</b><p id="er-${p}" class="font-black text-blue-950 text-xs md:text-sm mt-1">Rs. 90k – 180k</p></div><div class="p-2 bg-emerald-50 rounded-xl border border-emerald-200"><b>${tr('قرض/ہدف مکمل ہونے کا وقت','Time to Clear Debt / Goal')}</b><p id="dr-${p}" class="font-black text-emerald-950 text-xs md:text-sm mt-1">10 Months (ماہ)</p></div></div></div>`;
      }
    }

    function openTool(t) {
      const p = document.getElementById('topToolPanel');
      if (activeTopTool === t && !p.classList.contains('hidden')) { closeTopTool(); return; }
      activeTopTool = t; p.classList.remove('hidden'); renderToolHTML('topToolPanel', t, 'top');
    }
    function closeTopTool() { activeTopTool = null; document.getElementById('topToolPanel').classList.add('hidden'); }
    function toggleCardTool(e, id, t) {
      e.stopPropagation(); const cId = 'cardTool-' + id, el = document.getElementById(cId);
      if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; }
      el.classList.remove('hidden'); renderToolHTML(cId, t, 'c' + id);
    }

    function calcB(p) { let v = +document.getElementById('inc-'+p).value||0; document.getElementById('bn-'+p).textContent = 'Rs. '+Math.round(v*0.5).toLocaleString(); document.getElementById('bw-'+p).textContent = 'Rs. '+Math.round(v*0.3).toLocaleString(); document.getElementById('bs-'+p).textContent = 'Rs. '+Math.round(v*0.2).toLocaleString(); }
    function calcZ(p) { let t = (+document.getElementById('zc-'+p).value||0)+(+document.getElementById('zg-'+p).value||0)+(+document.getElementById('zb-'+p).value||0); document.getElementById('zt-'+p).textContent = 'Rs. '+Math.round(t*0.025).toLocaleString(); }
    function calcG(p) { let d = +document.getElementById('gd-'+p).value||0, r = +document.getElementById('gr-'+p).value||1, yr = d*365; document.getElementById('gy-'+p).textContent = 'Rs. '+yr.toLocaleString(); document.getElementById('gg-'+p).textContent = (yr/r).toFixed(2)+' Grams'; }
    function calcD(p) { let e = +document.getElementById('em-'+p).value||0, dt = +document.getElementById('dt-'+p).value||0, dp = +document.getElementById('dp-'+p).value||1; document.getElementById('er-'+p).textContent = `Rs. ${(e*3/1000).toFixed(0)}k – ${(e*6/1000).toFixed(0)}k`; document.getElementById('dr-'+p).textContent = Math.ceil(dt/dp) + tr(' ماہ (Months)',' Months'); }
    function addBiz(cId, p) { let d = document.getElementById('bd-'+p).value.trim(), a = +document.getElementById('ba-'+p).value||0, t = document.getElementById('bt-'+p).value; if (!d || a<=0) return; bizData.unshift({desc:d, amt:a, type:t}); localStorage.setItem('flp_biz_pro', JSON.stringify(bizData)); renderToolHTML(cId, 'business', p); }

    function postChatMessage(e) {
      e.preventDefault(); let n = document.getElementById('chatName').value.trim(), t = document.getElementById('chatText').value.trim(); if (!n || !t) return;
      chatData.unshift({ name: n, text: t, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      localStorage.setItem('flp_chat_pro', JSON.stringify(chatData)); document.getElementById('chatText').value = ''; renderChat();
    }
    function renderChat() {
      const def = { name: tr('ندیم اقبال (ڈویلپر)','Nadeem Iqbal (Developer)'), text: tr('خوش آمدید! ایپ کو مزید بہتر بنانے کے لیے اپنی قیمتی تجاویز اور آراء یہاں ضرور شیئر کریں۔','Welcome! Please share your valuable suggestions and feedback here to improve this app.'), time: tr('لائیو','Live') };
      document.getElementById('chatMessagesList').innerHTML = [def, ...chatData].map(c => `<div class="p-3 bg-slate-50 border rounded-2xl"><div class="flex justify-between mb-1"><span class="font-extrabold text-[#064E3B] text-xs">${c.name}</span><span class="text-[10px] text-gray-400">${c.time}</span></div><p class="text-gray-800 ${fCls()} text-xs">${c.text}</p></div>`).join('');
    }

    // Visual Toast with Up/Down Arrow Animation for Upload/Download
    function showToast(text, isUpload) {
      const toast = document.getElementById('progressToast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastText');
      icon.textContent = isUpload ? '⬆️' : '⬇️';
      icon.className = isUpload ? 'text-base animate-up' : 'text-base animate-down';
      msg.textContent = text;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function downloadCurrentPdf() {
      showToast(tr('📥 پی ڈی ایف ڈاؤن لوڈ ہو رہی ہے...', '📥 Downloading PDF...'), false);
    }

    function handleDevUpload() {
      const titleInput = document.getElementById('devPdfTitle');
      const fileInput = document.getElementById('devPdfFile');
      const msg = document.getElementById('uploadMsg');
      const title = titleInput.value.trim();

      if (fileInput.files.length > 0 && title) {
        showToast(tr('⬆️ نئی پی ڈی ایف اپلوڈ ہو رہی ہے...', '⬆️ Uploading new PDF...'), true);
        
        // Auto-Numbering calculation (Base 15 + uploaded count + 1)
        const newId = 16 + uploadedPdfs.length;
        const newPdfItem = [
          newId,
          'ڈویلپر اپلوڈ', 'Developer PDF',
          `${newId}. ${title}`, `${newId}. ${title}`,
          tr('یہ گائیڈ ڈویلپر کی طرف سے اپلوڈ کی گئی ہے۔', 'This guide was uploaded by the developer.'),
          tr('This guide was uploaded by the developer.', 'This guide was uploaded by the developer.'),
          null, '', '',
          [
            [tr('تفصیلی مواد اور معلومات', 'Detailed Content & Information'), tr('Detailed Content & Information', 'Detailed Content & Information'), tr('یہ فائل ڈویلپر کے ذریعہ پی ڈی ایف لائبریری میں شامل کی گئی ہے۔', 'This file was added to the PDF library by the developer.'), tr('This file was added to the PDF library by the developer.', 'This file was added to the PDF library by the developer.')]
          ]
        ];

        uploadedPdfs.push(newPdfItem);
        localStorage.setItem('flp_uploaded_pdfs', JSON.stringify(uploadedPdfs));

        setTimeout(() => {
          msg.textContent = tr(`✅ نمبر ${newId} کے طور پر کامیابی سے اپلوڈ ہو گئی!`, `✅ Successfully uploaded as #${newId}!`);
          titleInput.value = '';
          fileInput.value = '';
          renderGuides();
        }, 1500);
      } else {
        msg.textContent = tr('❌ براہ کرم گائیڈ کا نام اور پی ڈی ایف فائل دونوں منتخب کریں۔', '❌ Please enter a title and select a PDF file.');
      }
    }

    function renderGuides() {
      const q = (document.getElementById('searchBox').value || '').toLowerCase();
      // Combine base guides (1 to 15) with auto-numbered uploaded pdfs (16, 17...)
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const list = allGuides.filter(g => (lang === 'ur' ? g[1]+g[3]+g[5] : g[2]+g[4]+g[6]).toLowerCase().includes(q));

      document.getElementById('guidesList').innerHTML = list.map((g, idx) => `
        <div onclick="openGuide(${g[0]})" class="bg-white p-4 rounded-2xl border border-gray-200 shadow-md hover:border-[#D4AF37] transition cursor-pointer">
          <div class="flex justify-between items-center mb-1.5">
            <span class="px-2.5 py-0.5 bg-emerald-900 text-emerald-100 text-[10px] font-bold rounded-full">${tr(g[1], g[2])}</span>
            <div class="flex items-center gap-2">
              <span class="text-[10px] bg-amber-100 text-amber-900 px-2 py-0.5 rounded font-bold">#${idx + 1}</span>
              <button onclick="event.stopPropagation(); downloadCurrentPdf()" class="text-[10px] bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded font-bold hover:bg-emerald-200">📥 PDF</button>
            </div>
          </div>
          <h3 class="text-xs md:text-sm font-bold text-[#0A192F] ${fCls()} mb-1">${tr(g[3], g[4])}</h3>
          <p class="text-[11px] text-gray-600 ${fCls()} mb-3">${tr(g[5], g[6])}</p>
          <div class="flex flex-wrap justify-between items-center gap-2 pt-2.5 border-t text-xs">
            <span class="text-[#064E3B] font-extrabold">${tr('مکمل گائیڈ اور قانونی سٹیپس پڑھیں ←','Read Full Step-by-Step Guide →')}</span>
            ${g[7] ? `<button onclick="toggleCardTool(event, ${g[0]}, '${g[7]}')" class="px-3 py-1.5 gold-bg text-[#0A192F] font-extrabold text-[11px] rounded-xl shadow-sm">${tr(g[8], g[9])}</button>` : ''}
          </div>
          <div id="cardTool-${g[0]}" onclick="event.stopPropagation()" class="hidden mt-3"></div>
        </div>`).join('');
    }

    function toggleAcc(i) {
      const c = document.getElementById('acc-c-'+i), ic = document.getElementById('acc-i-'+i);
      const hide = !c.classList.contains('hidden'); c.classList.toggle('hidden', hide); ic.textContent = hide ? '▼' : '▲';
    }
    function openGuide(id) {
      currentModalId = id;
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const g = allGuides.find(x => x[0] === id); if (!g) return;
      document.getElementById('mTitle').textContent = tr(g[3], g[4]);
      document.getElementById('mBody').innerHTML = `
        <div class="bg-white p-4 rounded-2xl border-2 border-emerald-200 space-y-3">
          <div class="border-b pb-2">
            <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-900 text-white font-bold">${tr('پاکستانی قانونی و عملی گائیڈ','Pakistani Legal & Practical Roadmap')}</span>
            <p class="font-extrabold text-[#0A192F] text-xs md:text-sm ${fCls()} mt-2">${tr(g[5], g[6])}</p>
          </div>
          <p class="text-[11px] text-emerald-900 font-bold bg-amber-50 p-2.5 rounded-xl border border-amber-200 ${fCls()}">${tr('💡 ہدایت: نیچے کسی بھی پوائنٹ پر کلک کریں تاکہ اس کی سٹیپ بائی سٹیپ تفصیل کھل جائے:','💡 Tip: Click any bullet point below to expand its step-by-step action plan:')}</p>
          <div class="space-y-2">
            ${g[10].map((pt, i) => `
              <div class="bg-emerald-50/70 rounded-2xl border border-emerald-200 overflow-hidden">
                <button onclick="toggleAcc(${i})" class="w-full p-3.5 ${lang==='ur'?'text-right':'text-left'} font-extrabold text-[#0A192F] text-xs md:text-sm flex justify-between items-center gap-2 bg-white">
                  <span class="${fCls()}">${tr(pt[0], pt[1])}</span>
                  <span id="acc-i-${i}" class="text-emerald-800 text-xs bg-emerald-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">${i===0?'▲':'▼'}</span>
                </button>
                <div id="acc-c-${i}" class="${i===0?'':'hidden'} p-3.5 bg-emerald-50/90 border-t border-emerald-200 text-gray-900 text-xs md:text-sm ${fCls()} whitespace-pre-line">${tr(pt[2], pt[3])}</div>
              </div>`).join('')}
          </div>
        </div>`;
      document.getElementById('guideModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() { document.getElementById('guideModal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

    window.onload = () => { switchLang('ur'); updateLiveClock(); };
  </script>
</body>
</html>
