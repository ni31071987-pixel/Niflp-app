    function renderTool() {
      const p = document.getElementById('toolPanel'); if (!curTool) return;
      const head = (u, e) => `<div class="flex justify-between items-center mb-2.5 border-b pb-1.5 font-extrabold text-sm text-[#0A192F]"><span>${tr(u, e)}</span><button onclick="curTool=null;document.getElementById('toolPanel').classList.add('hidden')" class="text-red-600 text-xs px-2 py-0.5 bg-red-50 rounded">✕ ${tr('بند کریں','Close')}</button></div>`;
      const saveBtn = `<button onclick="setJ('flp_tv',tVal);msg(tr('💾 حساب سیو ہو گیا!','💾 Saved!'))" class="w-full mt-2.5 py-2 rounded-xl bg-emerald-700 text-white font-extrabold text-xs">💾 ${tr('سیو کریں (Save)','Save Data')}</button>`;

      if (curTool === 'budget') {
        let v = Math.max(0, tVal.inc || 50000);
        p.innerHTML = `${head('🧮 50/30/20 ماہانہ بجٹ کیلکولیٹر','🧮 50/30/20 Budget Calculator')}<label class="block font-bold mb-1">${tr('ماہانہ خالص آمدنی (PKR):','Monthly Net Income (PKR):')}</label><input type="number" min="0" value="${v}" oninput="tVal.inc=Math.max(0,+this.value||0);renderTool()" class="w-full p-2 border-2 border-emerald-700 rounded-xl mb-2 font-extrabold text-sm" /><div class="grid grid-cols-3 gap-2 text-center"><div class="p-2 bg-emerald-50 rounded-xl border"><b>${tr('50% ضروریات','50% Needs')}</b><p class="font-black text-emerald-950 mt-1">Rs. ${Math.round(v*0.5).toLocaleString()}</p></div><div class="p-2 bg-blue-50 rounded-xl border"><b>${tr('30% خواہشات','30% Wants')}</b><p class="font-black text-blue-950 mt-1">Rs. ${Math.round(v*0.3).toLocaleString()}</p></div><div class="p-2 bg-amber-50 rounded-xl border"><b>${tr('20% بچت','20% Savings')}</b><p class="font-black text-amber-950 mt-1">Rs. ${Math.round(v*0.2).toLocaleString()}</p></div></div>${saveBtn}`;
      } else if (curTool === 'committee') {
        let a = Math.max(0, tVal.cAmt || 5000), tot = comm.length, pd = comm.filter(x => x.ok).length;
        p.innerHTML = `${head('🗓️ کمیٹی (BC) شیڈول اور حساب','🗓️ Committee Tracker')}<label class="block font-bold mb-1">${tr('فی ممبر ماہانہ قسط (PKR):','Monthly Installment (PKR):')}</label><input type="number" min="0" value="${a}" onchange="tVal.cAmt=Math.max(0,+this.value||0);setJ('flp_tv',tVal);renderTool()" class="w-full p-2 border rounded-xl mb-2 font-bold" /><div class="grid grid-cols-2 gap-2 mb-2 text-center"><div class="p-2 bg-amber-50 rounded-xl border"><b>${tr(`کل کمیٹی (${tot})`,`Total Pot (${tot})`)}</b><p class="font-black">Rs. ${(a*tot).toLocaleString()}</p></div><div class="p-2 bg-emerald-50 rounded-xl border"><b>${tr(`جمع شدہ (${pd})`,`Collected (${pd})`)}</b><p class="font-black text-emerald-900">Rs. ${(a*pd).toLocaleString()}</p></div></div><div class="space-y-1.5 max-h-52 overflow-y-auto">${comm.map((s, i) => `<div class="flex items-center gap-1.5 p-1.5 bg-slate-50 border rounded-xl"><input value="${tr(s.mU, s.mE)}" oninput="comm[${i}][lang==='ur'?'mU':'mE']=this.value" class="w-16 p-1 border rounded bg-white text-[11px] font-bold" /><input value="${tr(s.nU, s.nE)}" oninput="comm[${i}][lang==='ur'?'nU':'nE']=this.value" class="flex-1 p-1 border rounded bg-white font-semibold" /><button onclick="comm[${i}].ok=!comm[${i}].ok;setJ('flp_cm',comm);renderTool()" class="px-2 py-1 rounded font-bold ${s.ok?'bg-emerald-100 text-emerald-900':'bg-amber-100 text-amber-900'}">${s.ok?tr('✓ ادا','✓ Paid'):tr('⏳ باقی','⏳ Due')}</button><button onclick="comm.splice(${i},1);setJ('flp_cm',comm);renderTool()" class="px-1.5 py-1 bg-red-100 text-red-700 rounded">🗑️</button></div>`).join('')}</div><div class="flex gap-2 mt-2.5"><button onclick="comm.push({mU:'نیا ماہ',mE:'Month',nU:'ممبر',nE:'Member',ok:false});setJ('flp_cm',comm);renderTool()" class="flex-1 py-2 bg-slate-200 rounded-xl font-bold">+ ${tr('نیا ممبر','Add')}</button><button onclick="setJ('flp_cm',comm);msg(tr('💾 کمیٹی سیو ہو گئی!','💾 Saved!'))" class="flex-1 py-2 bg-emerald-700 text-white rounded-xl font-bold">💾 ${tr('کمیٹی سیو کریں','Save')}</button></div>`;
      } else if (curTool === 'business') {
        let tin = 0, texp = 0, tdr = 0; biz.forEach(b => b.t==='in' ? tin+=b.a : b.t==='draw' ? tdr+=b.a : texp+=b.a);
        p.innerHTML = `${head('📒 کاروبار اور دکان کا کھاتہ','📒 Daily Business Cashbook')}<div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 mb-2 text-center"><div class="p-1.5 bg-emerald-50 rounded border"><b>${tr('کل سیل','Sales')}</b><p class="font-bold text-emerald-800">Rs.${tin.toLocaleString()}</p></div><div class="p-1.5 bg-red-50 rounded border"><b>${tr('دکان خرچ','Shop Exp')}</b><p class="font-bold text-red-700">Rs.${texp.toLocaleString()}</p></div><div class="p-1.5 bg-amber-50 rounded border"><b>${tr('گھر خرچ','Home')}</b><p class="font-bold text-amber-800">Rs.${tdr.toLocaleString()}</p></div><div class="p-1.5 bg-slate-900 text-white rounded"><b>${tr('خالص کیش','Net Cash')}</b><p class="font-black text-[#F3E5AB]">Rs.${(tin-texp-tdr).toLocaleString()}</p></div></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5 mb-2"><input id="bD" placeholder="${tr('تفصیل','Description')}" class="p-2 border rounded-xl" /><input type="number" min="1" id="bA" placeholder="${tr('رقم (PKR)','Amount')}" class="p-2 border rounded-xl font-bold" /><select id="bT" class="p-2 border rounded-xl font-bold"><option value="in">${tr('➕ آمدن / سیل','➕ Income')}</option><option value="exp">${tr('➖ دکان خرچ','➖ Shop Exp')}</option><option value="draw">${tr('🏠 گھر خرچ','🏠 Home Draw')}</option></select></div><button onclick="addBz()" class="w-full py-2 bg-emerald-700 text-white font-extrabold rounded-xl mb-2">💾 ${tr('+ کھاتے میں درج اور سیو کریں','+ Add & Save')}</button><div class="space-y-1 max-h-36 overflow-y-auto">${biz.map((b, i) => `<div class="flex justify-between items-center p-1.5 bg-slate-50 border rounded-lg gap-2"><span class="font-bold">${b.d}</span><span class="font-bold ${b.t==='in'?'text-emerald-700':'text-red-700'}">(${b.t==='in'?'+':'-'}) Rs.${b.a.toLocaleString()} <button onclick="biz.splice(${i},1);setJ('flp_bz',biz);renderTool()" class="text-red-600 ml-1">🗑️</button></span></div>`).join('')}</div>`;
      } else if (curTool === 'zakat') {
        let c = Math.max(0, tVal.zc||0), g = Math.max(0, tVal.zg||0), b = Math.max(0, tVal.zb||0), d = Math.max(0, tVal.zd||0), n = Math.max(1, tVal.zn||165000), net = Math.max(0, c+g+b-d);
        p.innerHTML = `${head('🪙 شرعی زکوٰۃ کیلکولیٹر (مع نصاب و قرض)','🪙 Shariah Zakat Calculator')}<div class="grid grid-cols-2 gap-2 mb-2"><div><label class="block font-bold mb-0.5">${tr('نقد کیش و بینک:','Cash & Bank:')}</label><input type="number" min="0" value="${c}" onchange="tVal.zc=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div><div><label class="block font-bold mb-0.5">${tr('سونا و چاندی مالیت:','Gold/Silver Value:')}</label><input type="number" min="0" value="${g}" onchange="tVal.zg=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div><div><label class="block font-bold mb-0.5">${tr('کاروباری مال اسٹاک:','Trade Stock:')}</label><input type="number" min="0" value="${b}" onchange="tVal.zb=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div><div><label class="block font-bold mb-0.5 text-red-700">${tr('منہا: واجب الادا قرض:','Less: Due Debt:')}</label><input type="number" min="0" value="${d}" onchange="tVal.zd=+this.value||0;renderTool()" class="w-full p-1.5 border border-red-300 rounded-lg font-bold text-red-700" /></div><div class="col-span-2"><label class="block font-bold mb-0.5">${tr('نصاب کی حد (52.5 تولہ چاندی PKR):','Nisab Threshold (PKR):')}</label><input type="number" min="1" value="${n}" onchange="tVal.zn=+this.value||165000;renderTool()" class="w-full p-1.5 border rounded-lg font-bold bg-emerald-50/40" /></div></div><div class="p-2.5 bg-emerald-50 rounded-xl border border-emerald-300 text-center font-extrabold">${net < n ? tr(`خالص مالیت (Rs.${net.toLocaleString()}) نصاب سے کم ہے — زکوٰۃ فرض نہیں۔`,`Net wealth (Rs.${net.toLocaleString()}) is below Nisab — No Zakat due.`) : `${tr('واجب الادا زکوٰۃ (2.5%):','Payable Zakat (2.5%):')} <span class="text-base text-emerald-950 font-black">Rs. ${Math.round(net*0.025).toLocaleString()}</span>`}</div>${saveBtn}`;
      } else if (curTool === 'gold') {
        let d = Math.max(0, tVal.gd||200), r = Math.max(1, tVal.gr||24000), yr = d*365, gr = yr/r;
        p.innerHTML = `${head('🥇 مائکرو گولڈ اور روزانہ بچت کیلکولیٹر','🥇 Micro-Gold Saving Calculator')}<div class="grid grid-cols-2 gap-2 mb-2"><div><label class="block font-bold mb-1">${tr('روزانہ بچت (PKR):','Daily Saving:')}</label><input type="number" min="0" value="${d}" onchange="tVal.gd=+this.value||0;renderTool()" class="w-full p-2 border rounded-xl font-bold" /></div><div><label class="block font-bold mb-1">${tr('1 گرام 24K سونے کا ریٹ:','Rate per Gram:')}</label><input type="number" min="1" value="${r}" onchange="tVal.gr=Math.max(1,+this.value||24000);renderTool()" class="w-full p-2 border rounded-xl font-bold" /></div></div><div class="grid grid-cols-3 gap-2 text-center"><div class="p-2 bg-amber-50 rounded-xl border"><b>${tr('سالانہ کیش','1-Yr Cash')}</b><p class="font-black mt-1">Rs.${yr.toLocaleString()}</p></div><div class="p-2 bg-emerald-50 rounded-xl border"><b>${tr('گرام سونا','Grams')}</b><p class="font-black mt-1">${gr.toFixed(2)} g</p></div><div class="p-2 bg-blue-50 rounded-xl border"><b>${tr('تولہ سونا','Tolas')}</b><p class="font-black mt-1">${(gr/11.664).toFixed(2)} T</p></div></div>${saveBtn}`;
      } else if (curTool === 'goal') {
        let e = Math.max(0, tVal.em||30000), dt = Math.max(0, tVal.dt||100000), dp = Math.max(0, tVal.dp||10000);
        p.innerHTML = `${head('🎯 ایمرجنسی فنڈ اور قرض نجات پلانر','🎯 Emergency Fund & Debt Planner')}<div class="grid grid-cols-3 gap-2 mb-2"><div><label class="block font-bold mb-1">${tr('ماہانہ خرچ:','Expense:')}</label><input type="number" min="0" value="${e}" onchange="tVal.em=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div><div><label class="block font-bold mb-1">${tr('کل قرض:','Total Debt:')}</label><input type="number" min="0" value="${dt}" onchange="tVal.dt=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div><div><label class="block font-bold mb-1">${tr('ماہانہ قسط:','Payoff:')}</label><input type="number" min="0" value="${dp}" onchange="tVal.dp=+this.value||0;renderTool()" class="w-full p-1.5 border rounded-lg font-bold" /></div></div><div class="grid grid-cols-2 gap-2 text-center"><div class="p-2 bg-blue-50 rounded-xl border"><b>${tr('محفوظ ایمرجنسی فنڈ (3 تا 6 ماہ)','3–6 Mo Emergency Fund')}</b><p class="font-black mt-1">Rs.${(e*3).toLocaleString()} – ${(e*6).toLocaleString()}</p></div><div class="p-2 bg-emerald-50 rounded-xl border"><b>${tr('قرض ختم ہونے کی مدت','Debt Payoff Time')}</b><p class="font-black mt-1">${dt===0?tr('بے قرض!','Debt-Free!'):dp<=0?tr('قسط درج کریں','Enter Payoff'):Math.ceil(dt/dp)+tr(' ماہ',' Months')}</p></div></div>${saveBtn}`;
      }
    }

    function addBz() {
      let d = document.getElementById('bD').value.trim(), a = +document.getElementById('bA').value||0, t = document.getElementById('bT').value;
      if (!d || a <= 0) return msg(tr('⚠️ تفصیل اور مثبت رقم لکھیں!','⚠️ Enter valid details!'));
      biz.unshift({ d, a, t, dt: new Date().toISOString().slice(0,10) }); setJ('flp_bz', biz); renderTool(); msg(tr('💾 کھاتے میں سیو ہو گیا!','💾 Saved!'));
    }

    function renderGuides() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      const list = rawGuides.filter(g => (g[1]+g[2]+g[3]).toLowerCase().includes(q));
      document.getElementById('guidesList').innerHTML = list.map(g => {
        const id = g[0], st = getSt(id), cat = tr(...g[1].split('|')), title = `${id}. ${tr(...g[2].split('|'))}`, sum = tr(...g[3].split('|'));
        return `<div onclick="openM(${id})" class="bg-white p-3.5 rounded-2xl border border-gray-200 shadow-sm hover:border-[#D4AF37] transition cursor-pointer">
          <div class="flex justify-between items-center mb-1">
            <span class="px-2.5 py-0.5 bg-emerald-900 text-emerald-100 text-[10px] font-bold rounded-full">${cat}</span>
            <div class="flex gap-1.5">
              <span class="text-[10px] bg-amber-100 text-amber-900 px-2 py-0.5 rounded font-bold">#${id}</span>
              <button onclick="event.stopPropagation();openM(${id});setTimeout(()=>window.print(),400)" class="text-[10px] bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded font-bold">🖨️ PDF</button>
            </div>
          </div>
          <h3 class="text-xs md:text-sm font-bold text-[#0A192F] ${fC()} mb-1">${title}</h3>
          <p class="text-[11px] text-gray-600 ${fC()} mb-2.5">${sum}</p>
          <div class="flex justify-between items-center pt-2 border-t text-xs">
            <span class="text-[#064E3B] font-extrabold">${tr('مکمل گائیڈ (10 منفرد اصول) پڑھیں ←','Read Full 10-Step Guide →')}</span>
            ${g[4] ? `<button onclick="event.stopPropagation();openTool('${g[4]}',true)" class="px-2.5 py-1 gold-bg text-[#0A192F] font-extrabold text-[10px] rounded-xl">${tr('🧮 ٹول کھولیں','🧮 Open Tool')}</button>` : ''}
          </div>
          <div onclick="event.stopPropagation()" class="flex justify-between items-center mt-2.5 pt-2 border-t border-dashed text-[11px] text-gray-600 font-bold">
            <span class="px-2 py-0.5 rounded bg-slate-100">👁️ ${st.v}</span>
            <button onclick="stClick(${id},'l')" class="px-2 py-0.5 rounded ${st.ok?'bg-red-50 text-red-600':'bg-slate-100'}">${st.ok?'❤️':'🤍'} ${st.l} ${tr('لائک','Like')}</button>
            <button onclick="document.getElementById('cb-${id}').classList.toggle('hidden')" class="px-2 py-0.5 rounded bg-slate-100">💬 ${st.c.length} ${tr('کمنٹ','Comment')}</button>
            <button onclick="stClick(${id},'s','${title}')" class="px-2 py-0.5 rounded bg-emerald-50 text-[#064E3B] border border-emerald-200">${shareSvg} ${st.s} ${tr('شیئر','Share')}</button>
          </div>
          <div id="cb-${id}" onclick="event.stopPropagation()" class="hidden mt-2 p-2.5 bg-slate-50 rounded-xl border text-xs space-y-2">
            <form onsubmit="addC(event,${id})" class="flex gap-1.5">
              <input id="cn-${id}" required placeholder="${tr('نام','Name')}" class="w-1/3 p-1.5 border rounded bg-white text-xs" />
              <input id="ct-${id}" required placeholder="${tr('تبصرہ لکھیں...','Comment...')}" class="flex-1 p-1.5 border rounded bg-white text-xs" />
              <button class="px-2.5 py-1 hero-bg text-white font-bold rounded">💾</button>
            </form>
            <div class="space-y-1 max-h-24 overflow-y-auto">${st.c.map(c => `<div class="p-1.5 bg-white border rounded"><b>${c.n}:</b>${c.t}</div>`).join('')}</div>
          </div>
        </div>`;
      }).join('');
    }

    function stClick(id, type, title) {
      const st = getSt(id);
      if (type === 'l') { st.ok = !st.ok; st.l = Math.max(0, st.l + (st.ok ? 1 : -1)); }
      else { st.s++; const u = location.href, t = `${title} - Financial Literacy Pakistan:\n${u}`; navigator.share ? navigator.share({title,text:t,url:u}).catch(()=>{}) : window.open(`https://wa.me/?text=${encodeURIComponent(t)}`,'_blank'); }
      setJ('flp_st', stats); renderGuides();
    }

    function addC(e, id) {
      e.preventDefault(); const st = getSt(id), n = document.getElementById('cn-'+id).value.trim(), t = document.getElementById('ct-'+id).value.trim();
      if (!n || !t) return; st.c.unshift({ n, t }); setJ('flp_st', stats); renderGuides();
      setTimeout(() => document.getElementById('cb-'+id).classList.remove('hidden'), 40);
    }

    function openM(id) {
      const g = rawGuides.find(x => x[0] === id); if (!g) return;
      const st = getSt(id); st.v++; setJ('flp_st', stats); renderGuides();
      document.getElementById('mTitle').textContent = `${id}. ${tr(...g[2].split('|'))}`;
      document.getElementById('mBody').innerHTML = `<p class="font-extrabold text-[#0A192F] ${fC()} mb-2">${tr(...g[3].split('|'))}</p>` + g[5].map((p, i) => {
        const [u, e] = p.split('|');
        return `<div class="bg-white rounded-xl border border-emerald-200 overflow-hidden"><button onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full p-3 ${lang==='ur'?'text-right':'text-left'} font-extrabold text-[#0A192F] flex justify-between items-center"><span class="${fC()}">${i+1}. ${tr(u, e)}</span><span class="text-emerald-800 text-xs">▼</span></button><div class="${i===0?'':'hidden'} p-3 bg-emerald-50/70 border-t text-gray-800 ${fC()}">${tr(`• عملی اصول: ${u}۔\n• آج ہی اس اصول کو اپنے ماہانہ پلان میں شامل کریں اور بچنے والی رقم کو حلال اثاثہ فنڈ میں لگائیں۔`,`• Actionable Principle: ${e}.\n• Apply this step today and channel the resulting savings directly into building halal micro-assets.`)}</div></div>`;
      }).join('');
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeM() { document.getElementById('modal').classList.add('hidden'); }

    function addChat(e) {
      e.preventDefault(); const n = document.getElementById('cName').value.trim(), t = document.getElementById('cText').value.trim();
      if (!n || !t) return; chats.unshift({ n, t }); setJ('flp_ch', chats); document.getElementById('cText').value = ''; renderChat(); msg(tr('💾 آپ کی رائے سیو ہو گئی!','💾 Feedback saved!'));
    }
    function renderChat() {
      const def = { n: tr('ندیم اقبال (ڈویلپر)','Nadeem Iqbal (Developer)'), t: tr('خوش آمدید! ایپ کو مزید بہتر بنانے کے لیے اپنی قیمتی تجاویز یہاں شیئر کریں۔','Welcome! Share your valuable suggestions here to improve this app.') };
      document.getElementById('chatList').innerHTML = [def, ...chats].map(c => `<div class="p-2.5 bg-slate-50 border rounded-xl"><b class="text-[#064E3B]">${c.n}:</b> <span class="${fC()}">${c.t}</span></div>`).join('');
    }

    setLang('ur');
  </script>
</body>
</html>
