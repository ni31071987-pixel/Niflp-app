  <script>
    let lang = 'ur', curTool = null, curTab = 'about', demoShop = 'food', dQty = {};
    let commSaveState = 'saved', hasUnsavedComm = false, commSaveTimer = null;
    let migrationWarning = null;
    let toolInputValid = { budget: true, committee: true, business: true, zakat: true, gold: true, goal: true };
    let toolDirty = { budget: false, committee: false, business: false, zakat: false, gold: false, goal: false };

    const tr = (u, e) => lang === 'ur' ? u : e;
    const fC = () => lang === 'ur' ? 'urdu-font' : 'eng-font';

    function esc(str) {
      return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }
    const isObj = x => typeof x === 'object' && x !== null && !Array.isArray(x);

    const getJ = (k, d) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : d; } catch(e) { return d; } };
    const setJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } };

    const STRICT_DEC_RE = /^(?:0|[1-9]\d*)(?:\.\d{1,2})?$/;

    function parseStrictFin(rawVal, min = 0, max = 1000000000) {
      if (rawVal === '' || rawVal === null || rawVal === undefined || typeof rawVal === 'boolean') {
        return { valid: false, val: null };
      }
      const str = String(rawVal).trim();
      if (!STRICT_DEC_RE.test(str)) return { valid: false, val: null };
      const n = Number(str);
      if (!Number.isFinite(n) || n < min || n > max) return { valid: false, val: null };
      return { valid: true, val: n };
    }

    function toNum(rawVal, def = 0, min = 0, max = 1000000000) {
      const res = parseStrictFin(rawVal, min, max);
      return res.valid ? res.val : def;
    }

    function fmtPKR(n) {
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function isValidLegacyBizArray(arr) {
      return Array.isArray(arr) && arr.every(b =>
        isObj(b) && typeof (b.d ?? b.desc) === 'string' && String(b.d ?? b.desc).trim().length > 0 && parseStrictFin(b.a ?? b.amt, 0, 1000000000).valid
      );
    }

    function isValidLegacyCommArray(arr) {
      return Array.isArray(arr) && arr.every(s =>
        isObj(s) && typeof (s.mU ?? s.mUr) === 'string' && typeof (s.nU ?? s.nUr) === 'string' && typeof (s.ok ?? s.paid) === 'boolean'
      );
    }

    function isValidLegacyChatArray(arr) {
      return Array.isArray(arr) && arr.every(c => isObj(c) && typeof (c.n ?? c.name) === 'string' && typeof (c.t ?? c.text) === 'string');
    }

    function performSafeMigrationWithBackup() {
      migrationWarning = null;
      try {
        localStorage.removeItem('flp_master_admin_pwd');
        localStorage.removeItem('flp_admin_pwd');

        const legacyKeys = ['flp_real_visitors', 'flp_total_visitors', 'flp_real_stats_v1', 'flp_social_stats', 'flp_tool_vals_v1', 'flp_tool_vals_v2', 'flp_comm_saved_v1', 'flp_biz_pro', 'flp_chat_pro'];
        const snap = {};
        legacyKeys.forEach(k => {
          const v = localStorage.getItem(k);
          if (v !== null) snap[k] = v;
        });

        if (Object.keys(snap).length > 0 && localStorage.getItem('flp_legacy_backup_v1') === null) {
          const serialized = JSON.stringify(snap);
          localStorage.setItem('flp_legacy_backup_v1', serialized);
        }

        if (localStorage.getItem('flp_bz') === null) {
          const oldBiz = getJ('flp_biz_pro', null);
          if (oldBiz !== null && isValidLegacyBizArray(oldBiz)) {
            const migratedBiz = oldBiz.map(b => ({
              d: String(b.d ?? b.desc).trim(),
              a: toNum(b.a ?? b.amt, 0, 0, 1000000000),
              t: ['in','exp','draw'].includes(b.t ?? b.type) ? (b.t ?? b.type) : 'in',
              dt: String(b.dt ?? b.date ?? '')
            }));
            setJ('flp_bz', migratedBiz);
          }
        }

        if (localStorage.getItem('flp_cm') === null) {
          const oldComm = getJ('flp_comm_saved_v1', null);
          if (oldComm !== null && isValidLegacyCommArray(oldComm)) {
            const migratedComm = oldComm.map(s => ({
              id: s.id ?? ('c_' + Math.random().toString(36).substr(2, 9)),
              mU: String(s.mU ?? s.mUr),
              mE: String(s.mE ?? s.mEn ?? s.mU ?? s.mUr),
              nU: String(s.nU ?? s.nUr),
              nE: String(s.nE ?? s.nEn ?? s.nU ?? s.nUr),
              ok: Boolean(s.ok ?? s.paid)
            }));
            setJ('flp_cm', migratedComm);
          }
        }

        if (localStorage.getItem('flp_tv') === null) {
          const oldTv = getJ('flp_tool_vals_v2', null) ?? getJ('flp_tool_vals_v1', null);
          if (isObj(oldTv)) {
            const migratedTv = {
              inc: toNum(oldTv.inc, 50000, 0),
              cAmt: toNum(oldTv.cAmt ?? oldTv.commAmt, 5000, 0),
              zc: toNum(oldTv.zc, 100000, 0),
              zg: toNum(oldTv.zg, 0, 0),
              zb: toNum(oldTv.zb, 0, 0),
              zd: toNum(oldTv.zd, 0, 0),
              zn: toNum(oldTv.zn, 165000, 1),
              gd: toNum(oldTv.gd, 200, 0),
              gr: toNum(oldTv.gr, 24000, 1),
              em: toNum(oldTv.em, 30000, 0),
              dt: toNum(oldTv.dt, 100000, 0),
              dp: toNum(oldTv.dp, 10000, 0)
            };
            setJ('flp_tv', migratedTv);
          }
        }

        if (localStorage.getItem('flp_ch') === null) {
          const oldCh = getJ('flp_chat_pro', null);
          if (oldCh !== null && isValidLegacyChatArray(oldCh)) {
            const migratedCh = oldCh.map(c => ({ n: String(c.n ?? c.name).trim(), t: String(c.t ?? c.text).trim() }));
            setJ('flp_ch', migratedCh);
          }
        }

        if (localStorage.getItem('flp_st') === null) {
          const oldSt = getJ('flp_real_stats_v1', null) ?? getJ('flp_social_stats', null);
          if (isObj(oldSt)) setJ('flp_st', oldSt);
        }

        if (localStorage.getItem('flp_v') === null) {
          const oldV = localStorage.getItem('flp_real_visitors') ?? localStorage.getItem('flp_total_visitors');
          if (oldV !== null && parseStrictFin(oldV, 0, 1000000000).valid) setJ('flp_v', Number(oldV));
        }

        return true;
      } catch (e) {
        return false;
      }
    }

    performSafeMigrationWithBackup();

    function msg(t) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = t;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function saveData(k, v, okU, okE) {
      if (setJ(k, v)) {
        if (okU) msg(tr(okU, okE));
        return true;
      }
      msg(tr('⚠️ انتباہ: میموری فل ہونے کی وجہ سے ڈیٹا محفوظ نہیں ہو سکا!', '⚠️ Warning: Could not save data due to storage limit!'));
      return false;
    }

    const shareSvg = `<svg class="w-3.5 h-3.5 inline fill-current" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>`;

    const demoCatalogs = {
      food: {
        name: '🍽️ سلیم ناشتہ پوائنٹ اینڈ جوس بار (ڈیمو مینو)|🍽️ Saleem Nashta Point & Juice Bar (Demo Menu)',
        items: [
          ['f1', 'حلوہ پوری و چنے پلیٹ|Halwa Puri & Chana Platter', 250],
          ['f2', 'اسپیشل دیسی گھی بیف نہاری|Special Beef Nihari', 450],
          ['f3', 'خستہ انڈہ پراٹھا|Crispy Egg Paratha', 180],
          ['f4', 'اسپیشل کڑک دودھ پتی چائے|Special Karak Tea', 100],
          ['f5', 'فریش مینگو / مالٹا جوس جگ|Fresh Mango / Orange Juice', 280],
          ['f6', 'پنجابی میٹھی مکھن لسی|Sweet Butter Lassi', 200]
        ]
      },
      sup: {
        name: '📦 ندیم جنرل سروسز اینڈ آرڈر سپلائرز (ہول سیل ڈیمو)|📦 Nadeem General Services & Order Suppliers (Demo)',
        items: [
          ['s1', 'فائن آٹا تھیلا (20 کلو)|Fine Flour Bag (20 KG)', 2150],
          ['s2', 'کوکنگ آئل کارٹن (5 پیکٹ)|Cooking Oil Carton (5 Packs)', 2650],
          ['s3', 'سفید چینی پیکٹ (5 کلو)|Refined Sugar (5 KG)', 720],
          ['s4', 'سپر کرنل باسمتی چاول (5 کلو)|Basmati Rice (5 KG)', 1650],
          ['s5', 'چائے کی پتی فیملی پیک (900 گرام)|Black Tea Pack (900g)', 1480],
          ['s6', 'صابن ہول سیل بنڈل (1 درجن)|Soap Bundle (1 Dozen)', 1150]
        ]
      }

    function updZakat() {
      const cRes = parseStrictFin(document.getElementById('z-c').value, 0, 1000000000);
      const gRes = parseStrictFin(document.getElementById('z-g').value, 0, 1000000000);
      const bRes = parseStrictFin(document.getElementById('z-b').value, 0, 1000000000);
      const dRes = parseStrictFin(document.getElementById('z-d').value, 0, 1000000000);
      const nRes = parseStrictFin(document.getElementById('z-n').value, 1, 1000000000);
      const box = document.getElementById('z-res');
      if (!box) return;

      if (!cRes.valid || !gRes.valid || !bRes.valid || !dRes.valid || !nRes.valid) {
        toolInputValid.zakat = false;
        box.textContent = tr('⚠️ براہ کرم تمام خانوں میں درست مثبت رقم درج کریں!', '⚠️ Please enter valid numbers!');
        return;
      }
      toolInputValid.zakat = true;
      tVal.zc = cRes.val; tVal.zg = gRes.val; tVal.zb = bRes.val; tVal.zd = dRes.val; tVal.zn = nRes.val;
      let net = Math.max(0, Number((cRes.val + gRes.val + bRes.val - dRes.val).toFixed(2)));
      box.textContent = net < nRes.val
        ? tr(`خالص مالیت (Rs. ${fmtPKR(net)}) نصاب سے کم ہے — زکوٰۃ فرض نہیں۔`, `Net wealth is below Nisab — No Zakat due.`)
        : tr(`واجب الادا زکوٰۃ (2.5%): Rs. ${fmtPKR(Number((net * 0.025).toFixed(2)))}`, `Payable Zakat (2.5%): Rs. ${fmtPKR(Number((net * 0.025).toFixed(2)))}`);
      toolDirty.zakat = true;
    }

      const dRes = parseStrictFin(document.getElementById('g-d').value, 0, 1000000000);
      const rRes = parseStrictFin(document.getElementById('g-r').value, 1, 1000000000);
      const yrEl = document.getElementById('g-yr'), grEl = document.getElementById('g-gr'), tlEl = document.getElementById('g-tl');
      if (!yrEl || !grEl || !tlEl) return;

      if (!dRes.valid || !rRes.valid) {

        yrEl.textContent = tr('⚠️ غلط ان پٹ', '⚠️ Invalid Input');
        grEl.textContent = '—'; tlEl.textContent = '—';
        return;
      }
      toolInputValid.gold = true;
      tVal.gd = dRes.val; tVal.gr = rRes.val;
      let yr = Number((dRes.val * 365).toFixed(2)), gr = yr / rRes.val;

      toolDirty.gold = true;

    function setCommState(nextState) {
      commSaveState = nextState;
      hasUnsavedComm = (nextState !== 'saved');
      renderCommStatusUI();

    function renderCommStatusUI() {
      const stEl = document.getElementById('commSaveStatus');
      if (!stEl) return;
      stEl.innerHTML = '';
      if (commSaveState === 'saved') {
        stEl.className = 'text-[11px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded';
        stEl.textContent = tr('✓ محفوظ ہے', '✓ Saved');
      } else if (commSaveState === 'unsaved') {
        stEl.className = 'text-[11px] font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded';
        stEl.textContent = tr('⏳ غیر محفوظ تبدیلیاں...', '⏳ Unsaved changes...');
      } else if (commSaveState === 'failed') {
        stEl.className = 'text-[11px] font-bold text-red-800 bg-red-100 px-2 py-0.5 rounded flex items-center gap-1.5';
        const warnSpan = document.createElement('span');
        warnSpan.textContent = tr('⚠️ سیو ناکام!', '⚠️ Save Failed!');
        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'px-1.5 py-0.5 bg-red-700 text-white rounded font-bold';
        retryBtn.textContent = tr('🔄 ری ٹرائی', '🔄 Retry');
        retryBtn.onclick = () => commitCommChanges(true);
        stEl.append(warnSpan, retryBtn);
      }
    }

    function markCommDirty() {
      setCommState('unsaved');

    function commitCommChanges(showToastMsg) {
      clearTimeout(commSaveTimer);
      if (setJ('flp_cm', comm)) {
        setCommState('saved');
        toolDirty.committee = false;
        if (showToastMsg) msg(tr('💾 کمیٹی ریکارڈ کامیابی سے سیو ہو گیا!', '💾 Committee record saved!'));
        return true;

    function exportFlpJsonBackup() {
      if (hasUnsavedComm && !commitCommChanges(false)) {
        msg(tr('⚠️ کمیٹی میں غیر محفوظ تبدیلیاں ہیں اور آٹو سیو ناکام ہو گیا!', '⚠️ Unsaved committee changes and auto-save failed!'));
        return;
      }
      for (const k in toolInputValid) {
        if (toolInputValid[k] === false) {
          alert(tr(`⚠️ ان پٹ ویلیڈیشن غلط ہے (${k})! پہلے درست ان پٹ دیں۔`, `⚠️ Input validation failed for (${k})! Please fix first.`));
          return;
        }
      }
      let hasDirty = Object.keys(toolDirty).some(k => toolDirty[k]);
      if (hasDirty) {
        if (!confirm(tr('⚠️ کچھ ٹولز یا کھاتوں میں غیر محفوظ تبدیلیاں موجود ہیں۔ کیا آپ پھر بھی موجودہ محفوظ ڈیٹا کا بیک اپ جاری رکھنا چاہتے ہیں؟', '⚠️ Some tools have unsaved drafts. Do you still want to export current saved backup?'))) {
          return;
        }
      }
      try {
        const keysToCheck = [
          { k: 'flp_cm', type: 'array' },
          { k: 'flp_bz', type: 'array' },
          { k: 'flp_tv', type: 'object' },
          { k: 'flp_st', type: 'object' },
          { k: 'flp_ch', type: 'array' },
          { k: 'flp_v', type: 'number' }
        ];
        
        const extractedData = {};
        const missingKeys = [];
        for (const item of keysToCheck) {
          const raw = localStorage.getItem(item.k);
          if (raw === null) {
            missingKeys.push(item.k);
            continue;
          }
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch (e) {
            alert(tr(`⚠️ خرابی: '${item.k}' کا ڈیٹا کرپٹ ہے! بیک اپ منسوخ کر دیا گیا۔`, `⚠️ Error: '${item.k}' data is corrupted! Backup aborted.`));
            return;
          }
          
          if (item.type === 'array') {
            if (!Array.isArray(parsed)) {
              alert(tr(`⚠️ خرابی: '${item.k}' کی ساخت درست نہیں ہے!`, `⚠️ Error: '${item.k}' schema mismatch!`));
              return;
            }
            if (item.k === 'flp_cm' && !isValidLegacyCommArray(parsed)) {
              alert(tr(`⚠️ خرابی: کمیٹی ریکارڈز کی ساخت خراب ہے!`, `⚠️ Error: Committee records schema mismatch!`));
              return;
            }
            if (item.k === 'flp_bz' && !isValidLegacyBizArray(parsed)) {
              alert(tr(`⚠️ خرابی: کاروباری کھاتے کی ساخت خراب ہے!`, `⚠️ Error: Business cashbook schema mismatch!`));
              return;
            }
            if (item.k === 'flp_ch' && !isValidLegacyChatArray(parsed)) {
              alert(tr(`⚠️ خرابی: چیٹ/تجاویز کے ریکارڈ کی ساخت درست نہیں ہے!`, `⚠️ Error: Chat records schema mismatch!`));
              return;
            }
          } else if (item.type === 'object') {
            if (!isObj(parsed)) {
              alert(tr(`⚠️ خرابی: '${item.k}' کی ساخت درست نہیں ہے!`, `⚠️ Error: '${item.k}' object schema mismatch!`));
              return;
            }
          } else if (item.type === 'number') {
            if (!Number.isSafeInteger(parsed) || parsed < 0 || parsed > 1000000000) {
              alert(tr(`⚠️ خرابی: '${item.k}' کی عددی ویلیو درست حدود میں نہیں ہے!`, `⚠️ Error: '${item.k}' invalid number value!`));
              return;
            }
          }
          extractedData[item.k] = parsed;
        }

        const backupObj = {
          version: 'FLP-2B-STRICT-FINAL',
          date: new Date().toISOString(),
          missingKeys: missingKeys,
          data: extractedData
        };

        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `FLP_Backup_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        msg(tr('📥 بیک اپ فائل ڈاؤن لوڈ شروع ہو گئی ہے!', '📥 Backup download started!'));
      } catch (e) {
        msg(tr('⚠️ بیک اپ ایکسپورٹ میں خرابی!', '⚠️ Backup export error!'));
      }
    }

      const st = getSt(id), g = rawGuides.find(x => x[0] === id);
      const title = g ? `${id}. ${tr(...g[2].split('|'))}` : 'Financial Literacy Pakistan';
      if (type === 'l') { st.ok = !st.ok; st.l = Math.max(0, st.l + (st.ok ? 1 : -1)); }
      else { st.s++; const u = location.href, t = `${title} - Financial Literacy Pakistan:\n${u}`; navigator.share ? navigator.share({title,text:t,url:u}).catch(()=>{}) : window.open(`https://wa.me/?text=${encodeURIComponent(t)}`,'_blank'); }
      stats[id] = st; saveData('flp_st', stats); renderGuides();
    }

    function addC(e, id) {
      e.preventDefault(); const st = getSt(id), n = document.getElementById('cn-'+id).value.trim(), t = document.getElementById('ct-'+id).value.trim();
      if (!n || !t) return;
      const nextStats = { ...stats, [id]: { ...st, c: [{ n, t }, ...st.c] } };
      if (saveData('flp_st', nextStats, '💾 تبصرہ محفوظ ہو گیا!', '💾 Comment saved!')) {
        stats = nextStats; renderGuides();
        setTimeout(() => document.getElementById('cb-'+id).classList.remove('hidden'), 40);
      }
    }

    function openM(id) {
      const g = rawGuides.find(x => x[0] === id); if (!g) return;
      const st = getSt(id); st.v++; stats[id] = st; saveData('flp_st', stats); renderGuides();
      document.getElementById('mTitle').textContent = `${id}. ${tr(...g[2].split('|'))}`;
      document.getElementById('mBody').innerHTML = `<p class="font-extrabold text-[#0A192F] ${fC()} mb-2">${esc(tr(...g[3].split('|')))}</p>` + g[5].map((p, i) => {
        const [u, e] = p.split('|');
        return `<div class="bg-white rounded-xl border border-emerald-200 overflow-hidden"><button type="button" onclick="this.nextElementSibling.classList.toggle('hidden')" class="w-full p-3 ${lang==='ur'?'text-right':'text-left'} font-extrabold text-[#0A192F] flex justify-between items-center"><span class="${fC()}">${i+1}. ${esc(tr(u, e))}</span><span class="text-emerald-800 text-xs">▼</span></button><div class="${i===0?'':'hidden'} p-3 bg-emerald-50/70 border-t text-gray-800 ${fC()} whitespace-pre-line">${esc(tr(`• عملی اصول: ${u}۔\n• آج ہی اس اصول کو اپنے ماہانہ پلان میں شامل کریں۔`,`• Actionable Principle: ${e}.\n• Apply this step today.`))}</div></div>`;
      }).join('');
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeM() { document.getElementById('modal').classList.add('hidden'); }

    function addChat(e) {
      e.preventDefault(); const n = document.getElementById('cName').value.trim(), t = document.getElementById('cText').value.trim();
      if (!n || !t) return;
      const nextChats = [{ n, t }, ...chats];
      if (saveData('flp_ch', nextChats, '💾 آپ کی رائے سیو ہو گئی!', '💾 Feedback saved!')) {
        chats = nextChats; document.getElementById('cText').value = ''; renderChat();
      }
    }

    function renderChat() {
      const box = document.getElementById('chatList');
      if (!box) return;
      box.innerHTML = '';
      const def = { n: tr('ندیم اقبال (ڈویلپر)','Nadeem Iqbal (Developer)'), t: tr('خوش آمدید! ایپ کو مزید بہتر بنانے کے لیے اپنی قیمتی تجاویز یہاں شیئر کریں۔','Welcome! Share your suggestions here.') };
      [def, ...chats].forEach(c => {
        const row = document.createElement('div');
        row.className = 'p-2.5 bg-slate-50 border rounded-xl';
        const b = document.createElement('b'); b.className = 'text-[#064E3B]'; b.textContent = c.n + ': ';
        const s = document.createElement('span'); s.className = fC(); s.textContent = c.t;
        row.append(b, s); box.appendChild(row);
      });
    }

    setLang('ur');
  </script>
</body>
</html>
