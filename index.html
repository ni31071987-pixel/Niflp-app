      let desiIdx = (mIdx + (dNum >= 15 ? 9 : 8)) % 12, desiDay = dNum >= 15 ? (dNum - 14) : (dNum + 16);
      let hUr = '4 ربیع الثانی 1448ھ', hEn = '4 Rabi al-Thani 1448 AH';
      try {
        hUr = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day:'numeric', month:'long', year:'numeric' }).format(now);

      document.getElementById('dateGregorian').textContent = lang === 'ur' ? `📅 ${daysUr[dIdx]}، ${dNum} ${mUr[mIdx]} ${yNum}ء` : `📅 ${daysEn[dIdx]}, ${mEn[mIdx]} ${dNum}, ${yNum}`;

    // Secret Developer Password Setup & Login (Triggered by clicking NI Logo)
    function triggerAdminSecret() {
      if (isAdminLoggedIn) return;
      let savedPwd = localStorage.getItem('flp_admin_pwd');
      if (!savedPwd) {
        const newPwd = prompt(tr('🔐 پہلی بار ڈویلپر سیٹ اپ: اپنا نیا ایڈمن پاسورڈ بنائیں (Create Password):', '🔐 First-Time Developer Setup: Create your new Admin Password:'));
        if (newPwd && newPwd.trim().length >= 3) {
          localStorage.setItem('flp_admin_pwd', newPwd.trim());
          isAdminLoggedIn = true;
          document.getElementById('adminPanel').classList.remove('hidden');
          renderGuides();
          showToast(tr('✅ آپ کا ڈویلپر پاسورڈ بن گیا اور ایڈمن موڈ آن ہو گیا!', '✅ Password created & Admin Mode activated!'), true);
        }
        return;
      }
      const pwd = prompt(tr('🔐 ڈویلپر پاسورڈ درج کریں:', '🔐 Enter Developer Password:'));
      if (pwd === savedPwd) {
        isAdminLoggedIn = true;
        document.getElementById('adminPanel').classList.remove('hidden');
        renderGuides();
        showToast(tr('🔓 ایڈمن موڈ فعال ہو گیا', '🔓 Admin Mode Activated'), true);
      } else if (pwd !== null) {
        alert(tr('❌ غلط پاسورڈ!', '❌ Incorrect Password!'));
      }
    }

      let currentPwd = localStorage.getItem('flp_admin_pwd');
      let oldInput = prompt(tr('موجودہ پاسورڈ درج کریں:', 'Enter current password:'));
      if (oldInput === currentPwd) {
        let newInput = prompt(tr('نیا پاسورڈ درج کریں:', 'Enter new password:'));
        if (newInput && newInput.trim().length >= 3) {

          alert(tr('✅ پاسورڈ کامیابی سے تبدیل ہو گیا!', '✅ Password successfully updated!'));

        alert(tr('❌ موجودہ پاسورڈ غلط ہے!', '❌ Incorrect current password!'));
      }
    }

    // Social Engagement Actions (Like, Share, Comment)
    function toggleLike(e, id) {
      e.stopPropagation();
      const st = getStat(id);
      st.liked = !st.liked;
      st.likes += st.liked ? 1 : -1;
      saveStats(); renderGuides();
    }

    function shareGuide(e, id, title) {
      e.stopPropagation();
      const st = getStat(id);
      st.shares += 1;
      saveStats(); renderGuides();
      const url = window.location.href;
      const text = `${title} - فنانشل لٹریسی پاکستان ایپ:\n${url}`;
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      }
    }

      e.stopPropagation();
      const el = document.getElementById('commBox-' + id);
      if (el) el.classList.toggle('hidden');

    function addGuideComment(e, id) {
      e.preventDefault(); e.stopPropagation();
      const nameEl = document.getElementById('cName-' + id);
      const textEl = document.getElementById('cText-' + id);
      const n = nameEl.value.trim(), t = textEl.value.trim();
      if (!n || !t) return;

      st.comments.unshift({ name: n, text: t, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      saveStats(); renderGuides();
      setTimeout(() => { const box = document.getElementById('commBox-' + id); if (box) box.classList.remove('hidden'); }, 50);
    }

    function closeTopTool() { activeTopTool = null; document.getElementById('topToolPanel').classList.add('hidden'); }
    function toggleCardTool(e, id, t) {
      e.stopPropagation(); const cId = 'cardTool-' + id, el = document.getElementById(cId);

      el.classList.remove('hidden'); renderToolHTML(cId, t, 'c' + id);

    function calcB(p) { let v = +document.getElementById('inc-'+p).value||0; document.getElementById('bn-'+p).textContent = 'Rs. '+Math.round(v*0.5).toLocaleString(); document.getElementById('bw-'+p).textContent = 'Rs. '+Math.round(v*0.3).toLocaleString(); document.getElementById('bs-'+p).textContent = 'Rs. '+Math.round(v*0.2).toLocaleString(); }
    function calcZ(p) { let t = (+document.getElementById('zc-'+p).value||0)+(+document.getElementById('zg-'+p).value||0)+(+document.getElementById('zb-'+p).value||0); document.getElementById('zt-'+p).textContent = 'Rs. '+Math.round(t*0.025).toLocaleString(); }
    function calcG(p) { let d = +document.getElementById('gd-'+p).value||0, r = +document.getElementById('gr-'+p).value||1, yr = d*365; document.getElementById('gy-'+p).textContent = 'Rs. '+yr.toLocaleString(); document.getElementById('gg-'+p).textContent = (yr/r).toFixed(2)+' Grams'; }
    function calcD(p) { let e = +document.getElementById('em-'+p).value||0, dt = +document.getElementById('dt-'+p).value||0, dp = +document.getElementById('dp-'+p).value||1; document.getElementById('er-'+p).textContent = `Rs. ${(e*3/1000).toFixed(0)}k – ${(e*6/1000).toFixed(0)}k`; document.getElementById('dr-'+p).textContent = Math.ceil(dt/dp) + tr(' ماہ (Months)',' Months'); }

    function showToast(text, isUpload) {
      const toast = document.getElementById('progressToast');

      const msg = document.getElementById('toastText');
      arrow.textContent = isUpload ? '⬆️' : '⬇️';

    function downloadPdfFile(pdfUrl, title) {
      showToast(tr(`📥 "${title}" ڈاؤن لوڈ ہو رہی ہے...`, `📥 Downloading "${title}"...`), false);
      setTimeout(() => {
        if (pdfUrl && (pdfUrl.startsWith('data:') || pdfUrl.startsWith('blob:'))) {
          const a = document.createElement('a');
          a.href = pdfUrl; a.download = title + '.pdf';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        } else {
          window.print();
        }
      }, 900);
    }

    function handleDevUpload() {
      const titleInput = document.getElementById('devPdfTitle');
      const fileInput = document.getElementById('devPdfFile');
      const msg = document.getElementById('uploadMsg');
      const title = titleInput.value.trim();

      if (fileInput.files.length > 0 && title) {
        showToast(tr('⬆️ نئی پی ڈی ایف اپلوڈ ہو رہی ہے...', '⬆️ Uploading new PDF...'), true);
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          const dataUrl = evt.target.result;
          const newId = Date.now();
          const newPdfItem = [
            newId, 'ڈویلپر پی ڈی ایف', 'Developer PDF', title, title,
            'ڈویلپر کی جانب سے اپلوڈ کردہ خصوصی پی ڈی ایف گائیڈ۔', 'Special PDF guide uploaded by the developer.',
            null, '', '',
            [['پی ڈی ایف دستاویز (مکمل ریڈ ایبل)', 'PDF Document (Readable)', 'نیچے یا اوپر دیے گئے PDF بٹن پر کلک کر کے پوری پی ڈی ایف فائل پڑھیں اور ڈاؤن لوڈ کریں۔', 'Click the PDF button above to view or download the complete file.']],
            dataUrl
          ];
          try {
            uploadedPdfs.push(newPdfItem);
            localStorage.setItem('flp_uploaded_pdfs_v3', JSON.stringify(uploadedPdfs));
          } catch(err) {
            newPdfItem[11] = URL.createObjectURL(file);
          }
          msg.textContent = tr('✅ پی ڈی ایف کامیابی سے اپلوڈ ہو گئی!', '✅ PDF uploaded successfully!');
          titleInput.value = ''; fileInput.value = '';
          renderGuides();
        };
        reader.readAsDataURL(file);
      } else {
        msg.textContent = tr('❌ براہ کرم گائیڈ کا نام اور پی ڈی ایف فائل دونوں منتخب کریں۔', '❌ Please enter a title and select a PDF file.');
      }
    }

    function deleteGuide(event, id) {
      event.stopPropagation();
      if (confirm(tr('کیا آپ واقعی اس گائیڈ کو حذف کرنا چاہتے ہیں؟ باقی نمبرز خودکار اپڈیٹ ہو جائیں گے۔', 'Delete this guide? Remaining numbers will auto-update.'))) {
        const upIdx = uploadedPdfs.findIndex(x => x[0] === id);
        if (upIdx !== -1) {
          uploadedPdfs.splice(upIdx, 1);
          localStorage.setItem('flp_uploaded_pdfs_v3', JSON.stringify(uploadedPdfs));
        } else {
          baseGuides = baseGuides.filter(x => x[0] !== id);
          deletedBaseIds.push(id);
          localStorage.setItem('flp_deleted_base', JSON.stringify(deletedBaseIds));
        }
        renderGuides();
        showToast(tr('🗑️ گائیڈ حذف ہو گئی اور نمبرنگ اپڈیٹ ہو گئی!', '🗑️ Guide deleted & numbering auto-updated!'), false);
      }
    }

    function openGuide(id, displayNum) {
      currentModalId = id;
      const allGuides = [...baseGuides, ...uploadedPdfs];
      const g = allGuides.find(x => x[0] === id); if (!g) return;

      // Increment Guide View Counter Automatically
      const st = getStat(id);
      st.views += 1;
      saveStats();
      renderGuides();

      const numPrefix = displayNum ? `${displayNum}. ` : '';
      document.getElementById('mTitle').textContent = numPrefix + tr(g[3], g[4]);
      
      let pdfPreview = g[11] ? `
        <div class="p-3 bg-emerald-950 text-white rounded-xl flex items-center justify-between">
          <span class="text-xs font-bold">📄 ${tr('اصل پی ڈی ایف فائل منسلک ہے','Original PDF File Attached')}</span>
          <a href="${g[11]}" target="_blank" class="px-3 py-1.5 rounded-lg gold-bg text-[#0A192F] font-extrabold text-xs">👁️ ${tr('پی ڈی ایف کھولیں','Open Full PDF')}</a>
        </div>` : '';

      document.getElementById('mBody').innerHTML = `
        <div class="bg-white p-4 rounded-2xl border-2 border-emerald-200 space-y-3">
          ${pdfPreview}
          <div class="border-b pb-2 flex justify-between items-center flex-wrap gap-2">
            <div>
              <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-emerald-900 text-white font-bold">${tr('پاکستانی قانونی و عملی گائیڈ','Pakistani Legal & Practical Roadmap')}</span>
              <p class="font-extrabold text-[#0A192F] text-xs md:text-sm ${fCls()} mt-2">${tr(g[5], g[6])}</p>
            </div>
            <span class="text-[11px] bg-slate-100 px-2.5 py-1 rounded-lg font-bold text-gray-700">👁️ ${st.views} ${tr('مرتبہ پڑھا گیا','Views')}</span>
          </div>
          <p class="text-[11px] text-emerald-900 font-bold bg-amber-50 p-2.5 rounded-xl border border-amber-200 ${fCls()}">${tr('💡 ہدایت: نیچے کسی بھی پوائنٹ پر کلک کریں تاکہ اس کی سٹیپ بائی سٹیپ تفصیل کھل جائے:','💡 Tip: Click any bullet point below to expand its step-by-step action plan:')}</p>
          <div class="space-y-2">
            ${g[10].map((pt, i) => `
              <div class="bg-emerald-50/70 rounded-2xl border border-emerald-200 overflow-hidden">
                <button onclick="toggleAcc(${i})" class="w-full p-3.5 ${lang==='ur'?'text-right':'text-left'} font-extrabold text-[#0A192F] text-xs md:text-sm flex justify-between items-center gap-2 bg-white">
                  <span class="${fCls()}">${tr(pt[0], pt[1])}</span>
                  <span id="acc-i-${i}" class="text-emerald-800 text-xs bg-emerald-100 w-6 h-6 rounded-full flex items-center justify-center shrink-0">${i===0?'▲':'▼'}</span>
                </button>
                <div id="acc-c-${i}" class="${i===0?'':'hidden'} p-3.5 bg-emerald-50/90 border-t border-emerald-200 text-gray-900 text-xs md:text-sm ${fCls()} whitespace-pre-line">${tr(pt[2], pt[3])}</div>
              </div>`).join('')}
          </div>
        </div>`;
      document.getElementById('guideModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() { document.getElementById('guideModal').classList.add('hidden'); document.body.style.overflow = 'auto'; }

    window.onload = () => { switchLang('ur'); updateLiveClock(); };
  </script>
</body>
</html>
